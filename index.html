<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>pysdet | Coming Soon</title>

    <meta
      name="description"
      content="pysdet is a software testing and test automation portfolio."
    />

    <link rel="stylesheet" href="./assets/css/styles.css" />
    <link rel="icon" href="./assets/images/favicon.svg" type="image/svg+xml" />
  </head>

  <body>
    <main class="page">
      <section class="hero" aria-labelledby="page-title">
        <div class="brand">
          <img class="logo" src="./assets/images/logo.svg" alt="pysdet logo" />

          <p class="brand-name">pysdet</p>
        </div>

        <div class="content">

                alt="LinkedIn"
              />

              href="https://github.com/pysdet"
              target="_blank"
              rel="noopener noreferrer"

                class="social-icon"

                alt="GitHub"
              />
