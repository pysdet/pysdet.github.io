  <!-- Bubbles coming out of the test tube -->
  <circle cx="225" cy="35" r="9" fill="#7fc843"/>
  <circle cx="225" cy="35" r="4" fill="#2b8d5c"/>

  <circle cx="326" cy="58" r="11" fill="#7fc843"/>
