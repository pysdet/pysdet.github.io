  <circle cx="280" cy="174" r="11" fill="#7fc843"/>
  <circle cx="280" cy="174" r="4" fill="#2b8d5c"/>

  <!-- Bubbles inside the liquid -->
  <circle cx="215" cy="247" r="15" fill="#7fc843"/>
  <circle cx="215" cy="247" r="6" fill="#2b8d5c"/>

  <circle cx="322" cy="285" r="12" fill="#7fc843"/>
  <circle cx="322" cy="285" r="5" fill="#2b8d5c"/>

  <circle cx="256" cy="370" r="14" fill="#7fc843"/>
  <circle cx="256" cy="370" r="5" fill="#2b8d5c"/>

</svg>
